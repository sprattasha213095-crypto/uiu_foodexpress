<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up | UIU FoodExpress</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-container">
    <h3>Register</h3>
    <form id="registerForm">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
      <select name="role" required>
        <option value="">Select Role</option>
        <option value="user">User</option>
        <option value="canteen_manager">Canteen Manager</option>
        <option value="delivery">Delivery Person</option>
      </select>
      <button type="submit">Sign Up</button>
    </form>
  </div>

  <script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const pass = formData.get("password");
      const confirm = document.getElementById("confirmPassword").value;
      if (pass !== confirm) return alert("Passwords do not match!");
      const res = await fetch("api/register.php", { method: "POST", body: formData });
      const text = await res.text();
      alert(text.includes("success") ? "Registered successfully!" : text);
    });
  </script>
</body>
</html>
